<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Content - Secure Timer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 12px; font-size: 22px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }
        .timer-box {
            margin-top: 15px;
            font-size: 15px;
            color: #38bdf8;
            font-weight: 600;
            display: none;
        }
        .alert-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⏱️ Complete Task to Unlock</h2>
        <p>Click the link below, stay on the opened page for 15 seconds, and then click verify to get your file and credits!</p>
        
        <!-- Direct Link -->
        <a href="https://omg10.com/4/11203254" target="_blank" class="btn" id="adLinkBtn" onclick="startTimer()">1. Click & Visit Ad Link 🚀</a>
        
        <div class="timer-box" id="timerBox">⏳ Time remaining: <span id="countdown">15</span> seconds</div>
        
        <div class="alert-msg" id="alertMsg">⚠️ Please wait for the 15-second timer to finish!</div>
        
        <br>
        <button class="btn" id="verifyBtn" style="background-color: #10b981; display: none;" onclick="completeVerification()">2. Get File & Credits 🎉</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let timerFinished = false;
        let timerStarted = false;

        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;

            const linkBtn = document.getElementById('adLinkBtn');
            const timerBox = document.getElementById('timerBox');
            const countdownEl = document.getElementById('countdown');
            const verifyBtn = document.getElementById('verifyBtn');

            linkBtn.style.opacity = '0.6';
            timerBox.style.display = 'block';

            let timeLeft = 15;
            let timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerBox.style.display = 'none';
                    timerFinished = true;
                    verifyBtn.style.display = 'block';
                    linkBtn.style.display = 'none';
                }
            }, 1000);
        }

        function completeVerification() {
            if (!timerFinished) {
                document.getElementById('alertMsg').style.display = 'block';
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.style.pointerEvents = 'none';
            verifyBtn.style.opacity = '0.8';
            
            // Ye raha naya message jo user ko button par dikhega
            verifyBtn.innerText = "✅ File & Credits Sent! Check Telegram Bot...";

            // Thoda sa gap dekar bot par redirect kar do taaki message clearly dikh jaye
            setTimeout(() => {
                window.location.href = `https://t.me/MyFile727_bot?start=VERIFY_AD`;
            }, 800);
        }
    </script>
</body>
</html>
