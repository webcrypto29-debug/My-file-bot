<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Your File</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag In-App SDK -->
  <script src='//ks313.com/sdk.js' data-zone='8981394' data-sdk='show_8981394'></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 28px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 50px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-success {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3) !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon" id="cardIcon">🎁</div>
    <h2 id="cardTitle">Unlock Your File</h2>
    <p id="cardDesc">Watch a short ad to automatically unlock your file in Telegram.</p>

    <!-- डायरेक्ट ऐक्शन बटन (कोई फालतू लोडिंग टेक्स्ट नहीं) -->
    <button id="mainBtn" class="btn" onclick="handleAdClick()">Watch Ad to Unlock</button>
  </div>

  <script>
    const BOT_USERNAME = "MyFile727_bot";
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let isAdFinished = false;

    function finishAndRedirect() {
      const redirectUrl = `https://t.me/${BOT_USERNAME}?start=VERIFY_AD`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(redirectUrl);
      } else {
        window.location.href = redirectUrl;
      }
      if (tg) {
        setTimeout(() => tg.close(), 300);
      }
    }

    function handleAdClick() {
      const btn = document.getElementById('mainBtn');
      const title = document.getElementById('cardTitle');
      const desc = document.getElementById('cardDesc');
      const icon = document.getElementById('cardIcon');

      // अगर एड पहले ही देखा जा चुका है और यूज़र "Get File" दबाता है:
      if (isAdFinished) {
        finishAndRedirect();
        return;
      }

      // Monetag In-App SDK ट्रिगर चेक
      if (typeof show_8981394 === 'function') {
        show_8981394()
          .then(() => {
            // एड पूरा देखने के बाद
            isAdFinished = true;
            icon.innerText = "✅";
            title.innerText = "Ad Completed!";
            desc.innerText = "Click below to claim your file inside Telegram.";
            btn.innerText = "Get Files 🚀";
            btn.className = "btn btn-success";
          })
          .catch((err) => {
            console.error("Ad failed or closed:", err);
            // एड फेल होने पर भी यूज़र को सीधे रिडायरेक्ट करने का ऑप्शन दो
            finishAndRedirect();
          });
      } else {
        // अगर ब्राउज़र या एड-ब्लॉकर की वजह से Monetag SDK लोड नहीं हुआ
        finishAndRedirect();
      }
    }
  </script>
</body>
</html>
