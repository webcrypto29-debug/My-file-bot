<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veronica Bot - Unlock Content</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag Rewarded SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>

    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background-color: #172033;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        p b {
            color: #cbd5e1;
        }

        .btn {
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* पहली स्क्रीन का बटन (नीला) */
        .btn-blue {
            background-color: #2563eb;
        }

        /* दूसरी स्क्रीन का बटन (हरा) */
        .btn-green {
            background-color: #16a34a;
        }

        /* दूसरी स्क्रीन को शुरू में छुपाने के लिए */
        #step2 {
            display: none;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1 (Image 1): वॉच ऐड कार्ड -->
    <div class="card" id="step1">
        <span class="icon">🔒</span>
        <h2>Unlock Your Content</h2>
        <p>Watch a short ad completely to get <b>+3 Credits</b> and auto-download your file.</p>
        <button class="btn btn-blue" onclick="watchAd()">Watch Ad to Unlock 🚀</button>
    </div>

    <!-- SCREEN 2 (Image 2): ऐड खत्म होने के बाद का गिफ़्ट कार्ड -->
    <div class="card" id="step2">
        <span class="icon">🎁</span>
        <h2>Unlock Your File</h2>
        <p>Watch a short rewarded ad to automatically unlock your file in Telegram.</p>
        <button class="btn btn-green" onclick="getFiles()">Get Files 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function watchAd() {
            if (typeof show_11452552 === 'function') {
                show_11452552().then(() => {
                    // जैसे ही यूज़र ऐड पूरा करके 'कट' (Close) पर क्लिक करेगा, पहली स्क्रीन छुप जाएगी और दूसरी स्क्रीन (Get Files) आ जाएगी।
                    document.getElementById("step1").style.display = "none";
                    document.getElementById("step2").style.display = "block";
                }).catch((err) => {
                    alert("Ad skipped or failed to complete. Please watch the full ad!");
                });
            } else {
                alert("Ad provider is still loading or blocked. Please wait 2 seconds, check internet, or disable Ad-Blocker/DNS!");
            }
        }

        function getFiles() {
            // 'Get Files 🚀' पर क्लिक करते ही बोट पर रिडायरेक्ट हो जाएगा जहाँ फ़ाइल और क्रेडिट्स मिल जाएँगे।
            window.location.href = "https://t.me/MyFile727_bot?start=VERIFY_AD";
        }
    </script>

</body>
</html>
