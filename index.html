<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad & Unlock File</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 90%;
        }
        h2 { margin-bottom: 15px; font-size: 20px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
    </style>

    <!-- Monetag SDK Script -->
    <script src="//libtl.com/sdk.js" data-zone="11452552" data-sdk="show_11452552"></script>
</head>
<body>

    <div class="container">
        <h2>🔒 Unlock Your File</h2>
        <p>Click the button below, watch the complete advertisement to get your credits and unlock the file instantly.</p>
        <button id="adBtn" class="btn" onclick="startMonetagAd()">Watch Ad Now 🎬</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // URL से टोकन निकालना
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';

        function startMonetagAd() {
            const btn = document.getElementById("adBtn");
            btn.innerText = "Loading Ad...";
            btn.disabled = true;

            // अगर फंक्शन तुरंत उपलब्ध है
            if (typeof show_11452552 === 'function') {
                runAd();
            } else {
                // नेटवर्क स्लो होने पर 1-1 सेकंड करके 5 बार चेक करेगा
                btn.innerText = "Connecting to Ad Network...";
                let attempts = 0;
                let checkInterval = setInterval(() => {
                    attempts++;
                    if (typeof show_11452552 === 'function') {
                        clearInterval(checkInterval);
                        runAd();
                    } else if (attempts > 5) {
                        clearInterval(checkInterval);
                        alert("Ad network is not responding or blocked. Please turn off Ad-blocker and try again.");
                        btn.innerText = "Watch Ad Now 🎬";
                        btn.disabled = false;
                    }
                }, 1000);
            }
        }

        function runAd() {
            show_11452552().then(() => {
                // एड पूरा देखने के बाद टोकन के साथ बॉट पर भेजना
                window.location.href = `https://t.me/MyFile727_bot?start=${token}`;
            }).catch((error) => {
                console.log("Ad skipped or failed:", error);
                const btn = document.getElementById("adBtn");
                btn.innerText = "Watch Ad Now 🎬";
                btn.disabled = false;
                alert("Please watch the full ad to unlock the file.");
            });
        }
    </script>
</body>
</html>
