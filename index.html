<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad & Unlock</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #2563eb;
        }
        .loading {
            margin-top: 15px;
            font-size: 13px;
            color: #38bdf8;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📁 Unlock Your File</h2>
        <p>Click the button below to start watching the ad. Once completed, you will receive your credits instantly.</p>
        
        <button class="btn" id="watchBtn" onclick="startAdProcess()">Watch Ad Now 🚀</button>
        <div class="loading" id="loadingText">Processing, please wait...</div>
    </div>

    <script>
        // Telegram WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand();

        function startAdProcess() {
            const btn = document.getElementById('watchBtn');
            const loadingText = document.getElementById('loadingText');
            
            btn.style.opacity = '0.6';
            btn.style.pointerEvents = 'none';
            loadingText.style.display = 'block';

            // URL से ad token निकालना जो बोट ने भेजा था
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            // यहाँ अपना Ad Network का असली कोड या लिंक डाल सकते हो
            // फ़िलहाल यह सिमुलेशन के लिए 2 सेकंड बाद बोट पर टोकन के साथ वापस भेज रहा है
            setTimeout(() => {
                if (token) {
                    // बोट पर वापस भेजने के लिए Telegram WebApp close करके start कमांड भेजना
                    window.location.href = `https://t.me/MyFile727_bot?start=${token}`;
                } else {
                    window.location.href = `https://t.me/MyFile727_bot?start=VERIFY_AD`;
                }
            }, 2500);
        }
    </script>
</body>
</html>
