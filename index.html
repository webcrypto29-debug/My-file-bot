<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Content - Timer Verification</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:active {
            background-color: #2563eb;
        }
        .timer-box {
            margin-top: 15px;
            font-size: 15px;
            color: #38bdf8;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⏱️ Complete Task to Unlock</h2>
        <p>Click the link below, stay on the opened page for 15 seconds, and then come back to get your file and +3 Credits!</p>
        
        <!-- Direct Link with 15s Timer -->
        <a href="https://omg10.com/4/11203254" target="_blank" class="btn" id="adLinkBtn" onclick="startTimer()">1. Click & Visit Ad Link 🚀</a>
        
        <div class="timer-box" id="timerBox">⏳ Please wait on the ad page... <span id="countdown">15</span>s</div>
        
        <br><br>
        <button class="btn" id="verifyBtn" style="background-color: #10b981; display: none;" onclick="completeVerification()">2. Get File & Credits 🎉</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function startTimer() {
            const linkBtn = document.getElementById('adLinkBtn');
            const timerBox = document.getElementById('timerBox');
            const countdownEl = document.getElementById('countdown');
            const verifyBtn = document.getElementById('verifyBtn');

            linkBtn.style.pointerEvents = 'none';
            linkBtn.style.opacity = '0.5';
            timerBox.style.display = 'block';

            let timeLeft = 15;
            let timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerBox.style.display = 'none';
                    verifyBtn.style.display = 'block';
                }
            }, 1000);
        }

        function completeVerification() {
            window.location.href = `https://t.me/MyFile727_bot?start=VERIFY_AD`;
        }
    </script>
</body>
</html>
