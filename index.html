<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Ad to Unlock File</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Replace YOUR_MONETAG_ZONE_ID with your actual Zone ID -->
  <script src='//ks.monetag.com/script.js?zoneid=YOUR_MONETAG_ZONE_ID'></script>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #121212; 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
    }
    h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }
    .btn { 
      background-color: #0088cc; 
      color: white; 
      padding: 15px 25px; 
      font-size: 18px; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: bold; 
    }
  </style>
</head>
<body>

  <h2>Watch an ad to unlock your file</h2>
  <button class="btn" onclick="startAd()">Watch Ad & Unlock 📁</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function startAd() {
      if (typeof show_YOUR_MONETAG_ZONE_ID === 'function') {
        show_YOUR_MONETAG_ZONE_ID().then(() => {
          tg.sendData("ad_completed");
          tg.close();
        }).catch(err => {
          alert("Please watch the complete ad to unlock the file!");
        });
      } else {
        alert("Ad is loading, please try again in a few seconds!");
      }
    }
  </script>
</body>
</html>
