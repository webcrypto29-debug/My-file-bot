    <script>
        // Telegram WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand();

        function showAd() {
            const btn = document.getElementById('watchBtn');
            const loadingText = document.getElementById('loadingText');
            
            btn.style.opacity = '0.6';
            btn.style.pointerEvents = 'none';
            loadingText.style.display = 'block';

            // Monetag / Ad Network Rewarded Call Logic
            if (typeof show_8875654 === 'function') { // अपनी zone id / function के हिसाब से इसे चेक कर सकते हैं

                    // Ad finished successfully
                    redirectToBot();
                }).catch((e) => {
                    // Fallback agar ad load na ho ya skip ho jaye
                    console.log("Ad error or closed:", e);

                });

                // Direct fallback agar SDK load hone mein time le toh thoda wait karke redirect kare
                setTimeout(() => {
                    redirectToBot();
                }, 3000);
