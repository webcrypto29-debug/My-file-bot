<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad to Unlock File</title>

    <!-- Ad Provider Script -->
    <script src='https://libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Watch Ad & Claim File</h2>
        <p id="status">Click below to watch the ad and unlock your credits.</p>

        <button id="adBtn" class="btn" onclick="watchAd()">Watch Ad Now 🚀</button>
    </div>

    <script>
        function completeAd() {
            document.getElementById('status').innerText = "✅ Verified! Redirecting to Bot...";
            
            // Telegram Bot ko verify param ke saath redirect karna
            setTimeout(() => {
                window.location.href = "https://t.me/MyFile727_bot?start=VERIFY_AD";
            }, 800);
        }

        function watchAd() {
            document.getElementById('status').innerText = "Playing ad... Please wait.";
            document.getElementById('adBtn').style.display = 'none';

            if (typeof window.show_11452552 === 'function') {
                window.show_11452552().then(() => {
                    completeAd();
                }).catch((err) => {
                    // Fallback to claim if ad skipped
                    completeAd();
                });
            } else {
                // Fallback if script fails to load
                completeAd();
            }
        }
    </script>
</body>
</html>
