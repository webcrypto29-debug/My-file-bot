            height: 100vh;
            margin: 0;

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mini App को फुल स्क्रीन मोड में खोलें

        function watchAd() {

                    window.location.href = "https://t.me/MyFile727_bot?start=VERIFY_AD";
                }).catch((err) => {
                    alert("Ad skipped or failed to complete. Please watch full ad to unlock!");
                });
            } else {
                alert("Ad provider is still loading or blocked. Please wait 2 seconds, check your internet, or disable any Ad-Blocker/Private DNS!");
            }
        }
