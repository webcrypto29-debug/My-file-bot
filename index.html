<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veronica Bot - Unlock Content</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag Rewarded SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>

    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background-color: #172033;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        p b {
            color: #cbd5e1;
        }

        .btn {
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-blue {
            background-color: #2563eb;
        }

        .btn-green {
            background-color: #16a34a;
        }

        #step2 {
            display: none;
        }

        #richads-container {
            display: none;
        }

        .bidvertiser-verify-container {
            margin-top: 15px;
            opacity: 0.8;
        }

        .step2-top-ad {
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- RICHADS TRACKING CONTAINER -->
    <div id="richads-container"></div>

    <!-- SCREEN 1: Watch Ad Card -->
    <div class="card" id="step1">
        
        <span class="icon">🔒</span>
        <h2>Unlock Your Content</h2>
        <p>Watch a short ad completely to get <b>+3 Credits</b> and auto-download your file.</p>
        <button class="btn btn-blue" onclick="watchAd()">Watch Ad to Unlock 🚀</button>

        <div class="bidvertiser-verify-container">
            <script type="text/javascript">
                BDV_Zone = 2106593;
            </script>
            <script type="text/javascript" src="//bdv.bidvertiser.com/BidVertiser.dbm?pid=2106593&bid=2106593"></script>
        </div>
    </div>

    <!-- SCREEN 2: Direct Redirect Card -->
    <div class="card" id="step2">
        
        <!-- AADS AD UNIT (SHIFTED TO STEP 2 TOP) -->
        <div id="frame" style="width: 100%; margin: 0 auto 15px auto; position: relative; z-index: 99998;">
            <iframe data-aa='2451775' src='//acceptable.a-ads.com/2451775/?size=Adaptive'
                    style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
        </div>

        <div class="step2-top-ad">
            <div data-banner-id="6124139"></div>
        </div>

        <span class="icon">🎁</span>
        <h2>Unlock Your File</h2>
        <p>You earned <b>+3 Credits</b>! Click below to claim your credits and unlock your file in Telegram.</p>

        <button class="btn btn-green" onclick="getFiles()">Get Link / Claim Credits 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- RichAds Impression Tracker ---
        const RICHADS_PUB_ID = "403411";
        const RICHADS_NOTIFICATION_URL = `https://vignette.richads.com/impression?pub_id=${RICHADS_PUB_ID}&event=impression`;

        function trackRichAdsImpression() {
            fetch(RICHADS_NOTIFICATION_URL, { method: "GET", mode: "no-cors" })
                .then(() => console.log("RichAds impression logged successfully!"))
                .catch((err) => console.error("RichAds tracking error:", err));

            const adScript = document.createElement("script");
            adScript.src = `https://vignette.richads.com/ad.js?pub_id=${RICHADS_PUB_ID}`;
            adScript.async = true;
            document.getElementById("richads-container").appendChild(adScript);
        }

        window.addEventListener("DOMContentLoaded", () => {
            trackRichAdsImpression();
        });

        // --- Monetag Rewarded Ad logic ---
        function watchAd() {
            if (typeof show_11452552 === 'function') {
                show_11452552().then(() => {
                    document.getElementById("step1").style.display = "none";
                    document.getElementById("step2").style.display = "block";
                }).catch((err) => {
                    alert("Ad skipped or failed to complete. Please watch the full ad!");
                });
            } else {
                alert("Ad provider is still loading or blocked. Please wait 2 seconds, check internet, or disable Ad-Blocker/DNS!");
            }
        }

        // Direct Redirection to Telegram Bot
        function getFiles() {
            const botUrl = "https://t.me/MyFile727_bot?start=VERIFY_AD";
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(botUrl);
                tg.close();
            } else {
                window.location.href = botUrl;
            }
        }
    </script>

</body>
</html>
