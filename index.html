<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Your File</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag In-App SDK -->
  <script src='//ks313.com/sdk.js' data-zone='8981394' data-sdk='show_8981394'></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 28px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 50px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-success {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3) !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon" id="cardIcon">🎁</div>
    <h2 id="cardTitle">Unlock Your File</h2>
    <p id="cardDesc">Watch a short rewarded ad to automatically unlock your file in Telegram.</p>

    <button id="mainBtn" class="btn" onclick="handleAdProcess()">Watch Ad to Unlock</button>
  </div>

  <script>
    const BOT_USERNAME = "MyFile727_bot";
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let isAdCompleted = false;

    function handleAdProcess() {
      const btn = document.getElementById('mainBtn');
      const title = document.getElementById('cardTitle');
      const desc = document.getElementById('cardDesc');
      const icon = document.getElementById('cardIcon');

      // STEP 2: जब यूजर ऐड देखकर 'Get Files' बटन पर क्लिक करेगा
      if (isAdCompleted) {
        const redirectUrl = `https://t.me/${BOT_USERNAME}?start=VERIFY_AD`;
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink(redirectUrl);
        } else {
          window.location.href = redirectUrl;
        }
        if (tg) {
          setTimeout(() => tg.close(), 300);
        }
        return;
      }

      // STEP 1: Monetag Ad ट्रिगर करना
      if (typeof show_8981394 === 'function') {
        show_8981394()
          .then(() => {
            // जैसे ही यूजर ऐड पूरा देखकर क्रॉस (X) बटन दबाएगा:
            isAdCompleted = true;
            icon.innerText = "🎉";
            title.innerText = "Task Completed!";
            desc.innerText = "Your ad verification is successful. Click below to get your file.";
            btn.innerText = "Get Files 🚀";
            btn.className = "btn btn-success";
          })
          .catch((err) => {
            console.error("Ad error or closed early:", err);
            // अगर एड किसी वजह से फेल हो, तो भी यूजर फंसे न
            isAdCompleted = true;
            btn.innerText = "Get Files 🚀";
            btn.className = "btn btn-success";
          });
      } else {
        // SDK न मिलने पर डायरेक्ट गेट फाइल्स इनेबल करना
        isAdCompleted = true;
        btn.innerText = "Get Files 🚀";
        btn.className = "btn btn-success";
      }
    }
  </script>
</body>
</html>
