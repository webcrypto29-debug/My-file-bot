<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Content - Rewarded Ad Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="//libtl.com/sdk.js" data-zone="11452552" data-sdk="show_11452552"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, opacity 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .timer-box {
            margin-top: 15px;
            font-size: 16px;
            color: #38bdf8;
            font-weight: 600;
            display: none;
        }
        .alert-msg {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⏱️ Complete Task to Unlock</h2>
        <p>Watch the rewarded ad completely, wait for the verification countdown, and receive your file and +3 credits automatically!</p>
        
        <button class="btn" id="adBtn" onclick="watchAd()">1. Watch Rewarded Ad 🚀</button>
        
        <div class="timer-box" id="timerBox">⏳ Verification in progress: <span id="countdown">15</span> seconds</div>
        
        <div class="alert-msg" id="alertMsg">
            ⚠️ <b>Ad failed or was closed early!</b><br>Please watch the ad fully and complete the timer to claim your reward.
        </div>
        
        <br>
        <button class="btn" id="verifyBtn" style="background-color: #10b981; display: none;" onclick="completeVerification()">2. Get File & Credits 🎉</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let adWatched = false;
        let timerFinished = false;

        function watchAd() {
            const adBtn = document.getElementById('adBtn');
            const alertMsg = document.getElementById('alertMsg');
            
            alertMsg.style.display = 'none';
            adBtn.disabled = true;
            adBtn.innerText = "Loading Ad...";

            if (typeof show_11452552 === 'function') {
                show_11452552('pop')
                    .then(() => {
                        adWatched = true;
                        adBtn.style.display = 'none';
                        startCountdown();
                    })
                    .catch((err) => {
                        console.error("Ad failed:", err);
                        adBtn.disabled = false;
                        adBtn.innerText = "1. Watch Rewarded Ad 🚀";
                        alertMsg.innerHTML = "⚠️ <b>Ad could not be loaded or was skipped!</b><br>Please try again.";
                        alertMsg.style.display = 'block';
                    });
            } else {
                adBtn.disabled = false;
                adBtn.innerText = "1. Watch Rewarded Ad 🚀";
                alertMsg.innerHTML = "⚠️ <b>Ad SDK blocked or unavailable!</b><br>Please disable ad blockers and try again.";
                alertMsg.style.display = 'block';
            }
        }

        function startCountdown() {
            const timerBox = document.getElementById('timerBox');
            const countdownEl = document.getElementById('countdown');
            const verifyBtn = document.getElementById('verifyBtn');

            timerBox.style.display = 'block';
            let timeLeft = 15;

            let timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerBox.style.display = 'none';
                    timerFinished = true;
                    verifyBtn.style.display = 'block';
                }
            }, 1000);
        }

        function completeVerification() {
            if (!adWatched || !timerFinished) {
                document.getElementById('alertMsg').style.display = 'block';
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.style.pointerEvents = 'none';
            verifyBtn.style.opacity = '0.8';
            verifyBtn.innerText = "✅ File & Credits Sent! Check Telegram Bot...";

            setTimeout(() => {
                window.location.href = `https://t.me/MyFile727_bot?start=VERIFY_AD`;
            }, 800);
        }
    </script>
</body>
</html>
