<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad to Unlock File</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Ad Provider Script (https mandatory) -->
    <script src='https://libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Watch Ad & Claim</h2>
        <p id="status">Click below to watch the ad and get your file.</p>

        <button id="adBtn" class="btn" onclick="watchAd()">Watch Ad Now 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function watchAd() {
            const statusTxt = document.getElementById('status');
            const btn = document.getElementById('adBtn');

            statusTxt.innerText = "Processing... Please wait.";

            // 1. Try playing the Rewarded Ad
            if (typeof window.show_11452552 === 'function') {
                window.show_11452552().then(() => {
                    claimFile();
                }).catch((err) => {
                    // Ad failed, fallback to claim
                    claimFile();
                });
            } else {
                // 2. If Ad script blocked by AdBlocker/DNS, directly allow claiming
                claimFile();
            }
        }

        function claimFile() {
            document.getElementById('status').innerText = "✅ Verified! Unlocking file...";
            setTimeout(() => {
                tg.sendData("ad_completed");
                tg.close();
            }, 800);
        }
    </script>
</body>
</html>
