<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad & Unlock Content</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag Rewarded Interstitial SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #2563eb;
        }
        .loading {
            margin-top: 15px;
            font-size: 13px;
            color: #38bdf8;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📁 Unlock Your Content</h2>
        <p>Click below to watch the ad. Complete the ad and close it to instantly receive +3 Credits and unlock your file!</p>
        
        <button class="btn" id="watchBtn" onclick="triggerAd()">Watch Ad Now 🚀</button>
        <div class="loading" id="loadingText">Ready to load ad...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function triggerAd() {
            const btn = document.getElementById('watchBtn');
            const loadingText = document.getElementById('loadingText');
            
            btn.style.opacity = '0.6';
            btn.style.pointerEvents = 'none';
            loadingText.innerText = "Opening Ad, please wait...";

            let adDone = false;

            // Check if Monetag SDK function exists
            if (typeof show_11452552 === 'function') {
                show_11452552().then(() => {
                    adDone = true;
                    redirectToBot();
                }).catch((err) => {
                    console.log("Ad error/closed:", err);
                    redirectToBot();
                });
            } else {
                // If SDK script is blocked or takes time inside Telegram WebView
                loadingText.innerText = "Redirecting for verification...";
                setTimeout(() => {
                    if (!adDone) {
                        redirectToBot();
                    }
                }, 2000);
            }
        }

        function redirectToBot() {
            window.location.href = `https://t.me/MyFile727_bot?start=VERIFY_AD`;
        }
    </script>
</body>
</html>
