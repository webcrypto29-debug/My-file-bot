<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad to Unlock File</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- आपका Ad Provider Script Header (अगर कोई सप्लाइड स्क्रिप्ट टैग है तो यहाँ डालें) -->
</head>
<body style="background-color: #121212; color: #ffffff; text-align: center; font-family: Arial, sans-serif; padding: 20px;">

    <h2>🎬 Watch Ad to Unlock</h2>
    <p id="status">Loading ad, please wait...</p>

    <button id="adBtn" onclick="watchAd()" style="background-color: #0088cc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; display: none;">
        Watch Ad Now 🚀
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ad Script Load Check
        window.onload = function() {
            if (typeof show_11452552 === 'function') {
                document.getElementById('status').innerText = "Click below to watch the ad and receive your reward!";
                document.getElementById('adBtn').style.display = 'inline-block';
            } else {
                document.getElementById('status').innerText = "Ad network loading... Click below if ready.";
                document.getElementById('adBtn').style.display = 'inline-block';
            }
        };

        function watchAd() {
            document.getElementById('status').innerText = "Playing ad...";
            
            if (typeof show_11452552 === 'function') {
                // आपका Ad Code
                show_11452552().then(() => {
                    // एड पूरा देखने के बाद Reward Trigger
                    document.getElementById('status').innerText = "✅ Ad Watched! Sending reward...";
                    
                    // Telegram Bot को सिग्नल भेजना
                    tg.sendData("ad_completed");
                    tg.close();
                }).catch((err) => {
                    alert("Ad failed to play or was closed early. Please try again.");
                    document.getElementById('status').innerText = "Error playing ad. Try again.";
                });
            } else {
                alert("Ad script not loaded properly. Check your connection.");
            }
        }
    </script>
</body>
</html>
