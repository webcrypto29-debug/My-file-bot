<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Ad & Unlock File</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 90%;
        }
        h2 { margin-bottom: 15px; font-size: 20px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
    </style>

    <!-- Monetag SDK Script (Zone ID: 11452552) -->
    <script src='//libtl.com/sdk.js' data-zone='11452552' data-sdk='show_11452552'></script>
</head>
<body>

    <div class="container">
        <h2>🔒 Unlock Your File</h2>
        <p>Click the button below, watch the complete advertisement to get your credits and unlock the file instantly.</p>
        <button id="adBtn" class="btn" onclick="startMonetagAd()">Watch Ad Now 🎬</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function startMonetagAd() {
            const btn = document.getElementById("adBtn");
            btn.innerText = "Loading Ad...";
            btn.disabled = true;

            // Check if Monetag function is loaded
            if (typeof show_11452552 === 'function') {
                show_11452552().then(() => {
                    // This executes after the user successfully watches the ad
                    alert('Ad watched successfully! Click OK to get your file.');
                    window.location.href = "https://t.me/MyFile727_bot?start=VERIFY_AD";
                }).catch((error) => {
                    console.log("Ad error or skipped:", error);
                    btn.innerText = "Watch Ad Now 🎬";
                    btn.disabled = false;
                    alert("Ad could not be loaded or was skipped. Please try again.");
                });
            } else {
                // Fallback if SDK fails to load (e.g. adblocker)
                alert("Ad network is taking time. Redirecting to bot...");
                setTimeout(() => {
                    window.location.href = "https://t.me/MyFile727_bot?start=VERIFY_AD";
                }, 1500);
            }
        }
    </script>
</body>
</html>
